[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-fs-mcp"
version = "1.0.0"
description = "Fast remote MCP server: read/write/list/edit/search files and run terminal commands, for any AI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahees Ahmed" }]
dependencies = [
  "fastmcp>=4.1,<5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
remote-fs-mcp = "remote_fs_mcp.__main__:main"

[tool.setuptools]
packages = ["remote_fs_mcp"]
